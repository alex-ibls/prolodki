schema: spec-driven

context: |
  Продукт: площадка «Пролодки» — маркетплейс лодок. Каталог — дерево: лодки под мотор (алюминий, стеклопластик, комбинированные, ПНД и ПП, РИБ, ПВХ) и гребные лодки. Бренд — отдельный справочник. Структуру каталога и бренды ведёт менеджер. Садовой техники нет.
  Два источника товара: 1P (новые товары компании площадки) и частные лица (только БУ, одна единица). Поставщиков нет.
  Покупательский цикл: каталог с фильтрами и поиском, карточка, корзина, заказ. Оплата офлайн: счёт, наличные, по договорённости. Онлайн-оплаты нет.
  Кроме витрины в первой версии: CRM менеджеров компании, номенклатура и остатки 1P с массовой загрузкой и корректировкой цен/остатков, личный кабинет покупателя и частного продавца в одном аккаунте.
  Стек: Next.js App Router, TypeScript, PostgreSQL, Drizzle, Auth.js (email и пароль), Tailwind, Zod, server actions.
  Язык интерфейса и спецификаций: русский.
  Референсы только по UX: ruBoats — визитка компании, Globaldrive — витрина. Контент, телефоны и товары референсов не копировать.
  Не входит: эквайринг, кредит, тарифы доставки, общий чат, отзывы, KYC, PDF-счета, телефония, рассылки, мультиязычность. Переписка по объявлению входит в витрину.

